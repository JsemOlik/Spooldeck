services:
  spooldeck:
    build: .
    image: spooldeck:latest
    container_name: spooldeck
    restart: unless-stopped
    # Reached by the reverse proxy over the shared "proxy" network as spooldeck:3000.
    # To open it directly instead, publish the port:
    # ports:
    #   - "3000:3000"
    networks:
      - default
      - proxy
    environment:
      # The container name rather than "postgres": other stacks on the shared proxy
      # network may have their own service called postgres.
      DATABASE_URL: postgres://spooldeck:${POSTGRES_PASSWORD:-spooldeck}@spooldeck-postgres:5432/spooldeck
      # The address you open Spooldeck at; encoded into label QR codes.
      # Can also be set later under Settings.
      PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: spooldeck-postgres
    restart: unless-stopped
    # Not published on the host; only the app container talks to it.
    environment:
      POSTGRES_USER: spooldeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spooldeck}
      POSTGRES_DB: spooldeck
    volumes:
      - spooldeck-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spooldeck -d spooldeck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spooldeck-postgres:

networks:
  # Shared with the reverse proxy container. Create it once: docker network create proxy
  proxy:
    external: true
