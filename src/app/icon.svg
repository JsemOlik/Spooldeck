  <circle class="spool" cx="16" cy="16" r="15" />
  <circle class="ring" cx="16" cy="16" r="9.5" stroke-width="2.4" stroke-dasharray="3.2 2.3" />
  <circle class="hub" cx="16" cy="16" r="4.4" />
